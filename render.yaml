# Render Blueprint — one-click deploy of the PayWay backend.
# Usage: Render dashboard → New → Blueprint → select this repo. Then set the
# `sync: false` secrets below (MoonPay + Transak keys) and deploy.
# The frontend (apps/web) deploys separately on Vercel — see DEPLOY.md.

services:
  # --- PayWay API (NestJS): always-on web service ---
  - type: web
    name: payway-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: USD
      - key: RUN_MIGRATIONS
        value: true # applies apps/api/prisma/migrations on boot
      - key: DATABASE_URL
        fromDatabase:
          name: payway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: payway-redis
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true # copy into the web app's NEXT_PUBLIC_ADMIN_TOKEN
      - key: PAYSTACK_SECRET_KEY
        sync: false # live sk_... from the Paystack dashboard (merchant KYB). Also signs webhooks.
      - key: SETTLEMENT_WALLET_USDT
        sync: false # our USDT receiving wallet (TRON)

  # --- Redis (BullMQ queues, idempotency fast-path) ---
  - type: keyvalue
    name: payway-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # no public access; API reaches it over the private network

  # --- Web app (Next.js): deploy AFTER the API once, with the values below ---
  # Next.js bakes NEXT_PUBLIC_* at build time, so this service is deployed in
  # two steps: 1) deploy the Blueprint, 2) fill these build args in the
  # dashboard (API URL + generated ADMIN_TOKEN) and redeploy just this service.
  - type: web
    name: payway-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    plan: starter
    healthCheckPath: /
    dockerBuildArgs:
      NEXT_PUBLIC_PAYWAY_API: https://payway-api.onrender.com # <-- set to your API URL, redeploy
      NEXT_PUBLIC_MERCHANT_ID: demo_merchant
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_live_xxx # <-- your live pk_...
      # NEXT_PUBLIC_ADMIN_SLUG: <your slug>
      # NEXT_PUBLIC_ADMIN_TOKEN: <paste the API's generated ADMIN_TOKEN, redeploy>

databases:
  - name: payway-db
    databaseName: payway
    user: payway
    plan: starter
